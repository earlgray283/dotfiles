name: Auto Update

on:
  schedule:
    - cron: '0 15 * * 0' # Every Monday at 00:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: NixOS/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: nix flake update
        id: flake-update
        run: |
          nix flake update 2>&1 | tee /tmp/flake-update.log
          diff=$(grep -A2 --no-group-separator '^•' /tmp/flake-update.log || true)
          {
            echo "diff<<EOF"
            echo "$diff"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Get short SHA
        id: short-sha
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/auto-update-${{ steps.short-sha.outputs.sha }}
          commit-message: "chore: auto update nix flake"
          title: "chore: weekly auto update"
          body: |
            Automated weekly update.

            **Flake inputs:**
            ${{ steps.flake-update.outputs.diff }}
          labels: dependencies
          delete-branch: true
