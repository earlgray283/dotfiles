name: Check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both configurations target aarch64-darwin, so they can only be built on a
  # macOS ARM runner. Without this the weekly auto-update PR is merged with no
  # evidence that it evaluates, let alone builds.
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: NixOS/nix-installer-action@main
        with:
          extra-conf: accept-flake-config = true

      # Each step runs a justfile recipe so that `just check` locally and CI
      # execute the same commands. .#just pins just to this flake's nixpkgs.
      - name: nix flake check
        run: nix run .#just -- flake-check

      - name: deadnix
        run: nix run .#just -- lint

      - name: Test chezmoi Codex merge
        run: nix run .#just -- test-chezmoi

      - name: Test Codex skills
        run: nix run .#just -- test-codex-skills

      - name: Build home-manager configuration
        run: nix run .#just -- build-home-manager

      - name: Build nix-darwin configuration
        run: nix run .#just -- build-darwin
