{{- /* chezmoi:modify-template */ -}}
{{- $current := .chezmoi.stdin -}}
{{- if eq $current "" -}}
  {{- $current = includeTemplate "nix/codex-baseline.toml" -}}
{{- end -}}
{{- $config := fromToml $current -}}
{{- $mcp := includeTemplate "nix/codex-mcp-servers.toml" | fromToml -}}
{{- $plugins := includeTemplate "nix/codex-plugins.toml" | fromToml -}}
{{- $config = mergeOverwrite $config $plugins -}}
{{- $config | setValueAtPath "mcp_servers" $mcp.mcp_servers | toToml -}}
