[settings.go]
set_gobin = false

[env]
# gcloud ships no Python on macOS and the system python3 is too old for it.
CLOUDSDK_PYTHON = "{{ env.HOME }}/.local/share/mise/installs/python/3.15/bin/python3"

[tools]
"1password-cli" = "latest"
actionlint = "latest"
bat = "latest"
biome = "latest"
buf = "latest"
bun = "latest"
clang = "latest"
clang-format = "latest"
cloudflared = "latest"
colima = "latest"
cue = "latest"
delta = "latest"
direnv = "latest"
docker-cli = "latest"
docker-compose = "latest"
dprint = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gcloud = "latest"
gh = "latest"
"github:docker/buildx" = { version = "latest", rename_exe = "docker-buildx" }
"github:docker/docker-language-server" = "latest"
"github:Feel-ix-343/markdown-oxide" = "latest"
"github:quarylabs/sqruff" = "latest"
"github:reteps/dockerfmt" = "latest"
gitleaks = "latest"
go = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
golangci-lint = "latest"
hadolint = "latest"
"github:sharkdp/hyperfine" = "latest"
just = "latest"
lazygit = "latest"
lima = "latest"
lua = "latest"
lua-language-server = "latest"
node = "latest"
"npm:@tailwindcss/language-server" = "latest"
"npm:typescript-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"
opencode = "latest"
"github:ouch-org/ouch" = "latest"
protolint = "latest"
# Capped by gcloud's MAX_SUPPORTED_PY3_VERSION; update-mise excludes it from --bump.
python = "3.15"
ripgrep = "latest"
rust = "latest"
starship = "latest"
stylua = "latest"
taplo = "latest"
tealdeer = "latest"
terraform = "latest"
terraform-ls = "latest"
tree-sitter = "latest"
uv = "latest"
usage = "latest"        # mise completions call it at tab time
vale = "latest"
worktrunk = "latest"
yamlfmt = "latest"
